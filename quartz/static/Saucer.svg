<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 200"
  preserveAspectRatio="none">

  <!-- very dark, barely visible cigar -->
  <ellipse
    cx="700"
    cy="100"
    rx="140"
    ry="20"
    fill="rgba(15,15,15,0.25)">

    <animate
      attributeName="cx"
      from="400"
      to="1000"
      dur="260s"
      repeatCount="indefinite"
      direction="alternate"
      calcMode="spline"
      keySplines="0.42 0 0.58 1" />
  </ellipse>

</svg>


