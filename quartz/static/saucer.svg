<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 200" preserveAspectRatio="none">

  <!-- DEBUG saucer: bright red, thick, obvious -->
  <ellipse
    cx="700"
    cy="100"
    rx="220"
    ry="40"
    fill="red"
    fill-opacity="1">

    <animate
      attributeName="cx"
      from="300"
      to="1100"
      dur="20s"
      repeatCount="indefinite"
      direction="alternate" />
  </ellipse>

</svg>
